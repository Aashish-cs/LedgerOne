apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerone-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledgerone-frontend
  template:
    metadata:
      labels:
        app: ledgerone-frontend
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ledgerone-frontend
      containers:
        - name: frontend
          image: ledgerone-frontend:replace-me
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: ledgerone-frontend
spec:
  selector:
    app: ledgerone-frontend
  ports:
    - port: 80
      targetPort: http
---
# The same Nginx image works with Docker Compose and Kubernetes.
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: ledgerone-api
  ports:
    - port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledgerone-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ledgerone-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledgerone-order-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ledgerone-order-worker
