apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerone-api
spec:
  selector:
    matchLabels:
      app: ledgerone-api
  template:
    metadata:
      labels:
        app: ledgerone-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: ledgerone
          image: ledgerone-backend:replace-me
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ledgerone-config
            - secretRef:
                name: ledgerone-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: order-api
            - name: MARKET_SIMULATOR_ENABLED
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /livez
              port: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerone-order-worker
spec:
  selector:
    matchLabels:
      app: ledgerone-order-worker
  template:
    metadata:
