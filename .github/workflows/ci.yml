name: LedgerOne CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -Pintegration verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  queued-orders:
    name: Kafka and PostgreSQL smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Start isolated stack
        run: docker compose -p ledgerone-queue -f docker-compose.yml -f docker-compose.queue.yml up -d --build --scale worker=2 backend worker
      - name: Wait for the API
        run: curl --fail --silent --show-error --retry 45 --retry-all-errors --retry-delay 2 http://127.0.0.1:18080/readyz
      - name: Verify persisted fills and replay safety
        run: node benchmarks/queued-orders.mjs
        env:
          ORDERS_PER_ACCOUNT: "5"
      - name: Print logs on failure
        if: failure()
        run: docker compose -p ledgerone-queue -f docker-compose.yml -f docker-compose.queue.yml logs --tail=150
      - name: Stop isolated stack
        if: always()
        run: docker compose -p ledgerone-queue -f docker-compose.yml -f docker-compose.queue.yml down -v

  aws-config:
    name: Validate AWS deployment files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - run: terraform -chdir=deploy/aws fmt -check
      - run: terraform -chdir=deploy/aws init -backend=false -input=false
      - run: terraform -chdir=deploy/aws validate
      - run: terraform -chdir=infra/aws fmt -check
      - run: terraform -chdir=infra/aws init -backend=false -input=false
      - run: terraform -chdir=infra/aws validate
      - name: Validate Kubernetes resources
        shell: bash
        run: |
          bash -n deploy/aws/deploy.sh
          kubectl kustomize deploy/kubernetes/aws | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.35.0
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.35.0 < deploy/aws/bootstrap-db.yaml
          kubectl kustomize deploy/kubernetes/local | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.35.0

  container-security:
    name: Build and scan container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ledgerone-backend:ci backend
      - run: docker build --build-arg VITE_QUEUED_ORDERS=true -t ledgerone-frontend:ci frontend
      - name: Scan backend image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 ledgerone-backend:ci
      - name: Scan frontend image
        if: always()
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 ledgerone-frontend:ci
