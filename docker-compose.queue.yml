x-order-environment: &order-environment
  DATABASE_JDBC_URL: jdbc:postgresql://db:5432/ledgerone
  DATABASE_USERNAME: ledgerone
  DATABASE_PASSWORD: ledgerone
  JWT_SECRET: local-compose-secret-change-for-real-deployments-32-bytes
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MARKET_LIVE_PRICES_ENABLED: "false"
  MARKET_SIMULATOR_ENABLED: "false"

services:
  db:
    ports: !override
      - "127.0.0.1:15432:5432"

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - ledgerone-kafka:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, localhost:9092, --list]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-topics:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for topic in ledgerone.orders.v1 ledgerone.orders.v1-dlt; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 6 --replication-factor 1
        done

  backend:
    image: ledgerone-queue:local
    environment:
      <<: *order-environment
      SPRING_PROFILES_ACTIVE: order-api
    ports: !override
      - "127.0.0.1:18080:8080"
    depends_on:
      kafka-topics:
        condition: service_completed_successfully

  worker:
    image: ledgerone-queue:local
    environment:
      <<: *order-environment
      SPRING_PROFILES_ACTIVE: order-worker
    depends_on:
      db:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully

volumes:
  ledgerone-kafka:
